<div class="app-page">
    <div>
        <div style="padding: 0px 10px 4px 10px;">
            <div style="float:left ; margin: 0px; padding: 0px; ">
                <p class="app-page-header">Query Executor: </p>
                
            </div>
            <div style="float:left ; margin: 0px; padding: 0px;">
                <button class="app-button" (click)="onRightMenuClick()"><i class="pi pi-database"></i></button>
            </div>
            <div class="app-button-group">

                <!-- <button (click)="filterBySelectedValue()"><i class="pi pi-filter" style="font-size:12px"></i> </button>
                <button (click)="columnSorting()"><i class="pi pi-sort" style="font-size:12px"></i> </button>
                <button (click)="columnDialog = true"><i class="pi pi-list-check" style="font-size:12px"></i> </button>
                <button (click)="sqlFormatar()"  ><i class="pi pi-align-center" style="font-size:12px"></i> </button> -->
                <button (click)="sumSelectedColumn()" pTooltip="Sum the selected column values" tooltipPosition="top">
                    <span style="font-size:14px;font-weight:bold;">Σ</span>
                </button>
                <button (click)="filterBySelectedValue()" pTooltip="Filter rows using the selected cell value"
                    tooltipPosition="top">
                    <i class="pi pi-filter" style="font-size:12px"></i>
                </button>

                <button (click)="columnSorting()" pTooltip="Sort the table by the selected column"
                    tooltipPosition="top">
                    <i class="pi pi-sort" style="font-size:12px"></i>
                </button>

                <button (click)="columnDialog = true" pTooltip="Show or hide table columns" tooltipPosition="top">
                    <i class="pi pi-list-check" style="font-size:12px"></i>
                </button>

                <button (click)="sqlFormatar()" pTooltip="Format the SQL query" tooltipPosition="top">
                    <i class="pi pi-align-center" style="font-size:12px"></i>
                </button>
                <button (click)="showFilterRow()" [disabled]="tableData.length==0">Filter</button>
                <button (click)="exportPDF()" [disabled]="tableData.length==0">Export PDF</button>
                <button (click)="exportExcel()" [disabled]="tableData.length==0">Export Excel</button>
                <button (click)="showParaForm()"> {{!isShowParaForm? 'Show':'Hide' }} Query </button>
                <button (click)="back()"><i class="pi pi-angle-left" style="font-size:12px"></i> Back</button>
                <button (click)="removeFilter()"><i class="pi pi-refresh" style="font-size:12px"></i> Refresh</button>
            </div>
        </div>
        <div class="clear-fix"></div>
        <hr style="margin: 0px; padding: 0px; width: 100%;">
    </div>



    <div *ngIf="isShowParaForm" style=" margin: 2px 20px 10px 20px; ">
        <form [formGroup]="form" class="app-card">

            <div class="row" style="padding: 10px 25px 0px 25px;">
                <div class="form-group">
                    <div class="col-sm-6 col-md-12">

                        <textarea id="queryString" class="input-layer" placeholder="Write Query"
                            formControlName="queryString" [style]="{'width':'100%','height':'200px'}" spellcheck="false"
                            [ngClass]="{
                          'is-invalid': form.controls.queryString?.touched &&
                          form.controls.queryString?.errors
                        }">
                </textarea>

                    </div>
                </div>
            </div>


            <div style="text-align:center; margin-bottom:20px; margin-top:20px;">
                <button type="submit" class="app-button" (click)="downloadedData()">
                    Show Report
                </button>
            </div>

        </form>


    </div>

    <div *ngIf="isShowReport" class="app-list">
        <div style="padding: 0px 5px 5px 5px;">
            <p-table class=" table-hover table-responsive" #dataTable (onFilter)="onFilter($event)" [value]="tableData"
                editMode="row" [columns]="visibleColumns" [(selection)]="selectedRows" [paginator]="true"
                [rows]="rowPerPage" selectionMode="multiple" [resizableColumns]="true" dataKey="__rowId"
                (onColResize)="columnResize($event)" columnResizeMode="expand" metaKeySelection="true"
                [scrollable]="true" (contextMenuSelection)]="selectedRow" [contextMenu]="cm">>
                <ng-template pTemplate="header" let-columns>

                    <!-- Header -->
                    <tr>
                        <th *ngFor="let col of columns" pResizableColumn
                            style="width: 150px !important ; min-width: 80px;">

                            {{ col.header }}

                        </th>
                    </tr>

                    <!-- Filter Row -->
                    <tr *ngIf="showFIlterRow">
                        <th *ngFor="let col of columns" style="padding: 0px !important; text-align: center;">

                            <p-columnFilter [field]="col.field" display="row" matchMode="contains" [showMenu]="false">

                                <ng-template pTemplate="filter" let-value let-filter="filterCallback">

                                    <input pInputText type="text" [ngModel]="value" (ngModelChange)="filter($event)"
                                        class="filter-input" [placeholder]="'Search'"
                                        style="width:100%; height:24px; padding:0px 0px; font-size:12px; background-color: whitesmoke;" />

                                </ng-template>

                            </p-columnFilter>

                        </th>
                    </tr>

                </ng-template>



                <ng-template pTemplate="body" let-rowData let-columns="columns" let-rowIndex="rowIndex">
                    <tr [pContextMenuRow]="rowData" [pSelectableRow]="rowData">

                        <td *ngFor="let col of columns; let colIndex = index" [ngStyle]="{ 'white-space': 'nowrap' }"
                            (click)=" onCellClick($event,rowData, col, rowIndex, colIndex)"
                            (contextmenu)="onCellClick($event,rowData, col, rowIndex, colIndex)"
                            [style.background]="isSelected(rowIndex, col.field) ? '#48dbfb' : ''"
                            [style.text-align]="col.align"
                            [class.selected-cell]="selectedRowIndex === rowIndex && selectedColIndex === colIndex"
                            [id]="'cell-' + rowIndex + '-' + colIndex" tabindex="0" [style.cursor]="'pointer'">

                            {{rowData[col.field]}}
                        </td>
                    </tr>
                </ng-template>

            </p-table>

        </div>
    </div>

    <p-dialog #op header="Select Column for Export as PDF" [modal]="true" [(visible)]="isExportPDF"
        [style]="{ width: '30rem' , height: '33rem'}">
        <button class="app-button" (click)="exportPdfReport()" style="margin-bottom: 5px;"
            [disabled]="isExporting">Export PDF Report</button>
        <p-multiSelect [options]="cols" [(ngModel)]="selectedPdfColumns" optionLabel="header"
            placeholder="Select PDF Columns" [style]="{width: '100%' , }">
        </p-multiSelect>

    </p-dialog>


    <div class="export-overlay" *ngIf="isExporting">
        <p-progressSpinner></p-progressSpinner>
        <span>Preparing Excel file...</span>
    </div>
    <p-contextMenu [style]="{  'width': '250px', 'font-size': '14px'}" #cm [model]="menuItems"
        styleClass="custom-context-menu"></p-contextMenu>

    <p-dialog [(visible)]="showCountDialog" [modal]="true" [style]="{width: '300px'}" [closable]="true">
        <div style="text-align:center; font-size:18px;">
            {{ countMessage }}
        </div>
        <br>
    </p-dialog>

    <p-dialog [(visible)]="columnDialog" appendTo="body"
        header="Check or uncheck to hide or visible the columns in table" [contentStyle]="{ overflow: 'auto' }"
        [closeOnEscape]="true">

        <!-- Select All Checkbox -->
        <div class="column-item" style="font-weight: bold;">
            <input type="checkbox" [(ngModel)]="selectAllColumns" (change)="toggleAllColumns()">

            <span style="padding-left:3px">
                Select All
            </span>
        </div>

        <hr style="margin: 0px; padding: 0px;">

        <div class="column-selector">
            <div *ngFor="let col of allColumns" class="column-item">
                <input type="checkbox" [(ngModel)]="col.visible" (change)="columnChange()">

                <span style="padding-left:3px">
                    {{ col.header }}
                </span>
            </div>
        </div>
    </p-dialog>

    <div style=" margin-top: -50px; ">
        <p-sidebar [(visible)]="sidebarVisible" [showCloseIcon]="false"
            [style]="{'height':'100%' , 'margin-top':'50px', 'width':'280px' , 'padding':'0px'}">
            <p>This is Object Viewr</p>
           
        </p-sidebar>
    </div>

</div>
