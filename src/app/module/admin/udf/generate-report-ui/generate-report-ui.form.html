<div class="app-page">
    <div>
        <div style="padding: 0px 10px 0px 10px;">
            <div style="float:left ; margin: 0px; padding: 0px; ">
                <p class="app-page-header">{{reportName}}</p>
            </div>
            <div class="app-button-group">

                <button (click)="back()"><i class="pi pi-angle-left" style="font-size:12px"></i> Back</button>
                <button (click)="refresh()"><i class="pi pi-refresh" style="font-size:12px"></i> Refresh</button>
            </div>
        </div>
        <div class="clear-fix"></div>
        <hr style="margin: 0px; padding: 0px; width: 100%;">
    </div>

    <div style=" margin: 10px 20px 10px 20px;">
        <form [formGroup]="form" class="app-card" style=" margin-bottom: 15px;">
            <div class="row " *ngIf="form" style="padding: 0px 25px 0px 25px; ">
                <ng-container *ngFor="let field of visibleFields(); let i = index">
                    <div [class]="field.styleClass" style="margin-bottom: 10px;">
                        <ng-container [ngSwitch]="field.dataType">

                            <div *ngSwitchCase="'DATE'" class="form-group" style=" padding-left: 10;">
                                <div class="app-input-field-date">
                                    <input type="date" [id]="field.name" [formControlName]="field.name"
                                        [ngClass]="{'is-invalid' : isInvalid('form', field.name)}">
                                    <label [for]="field.name">{{ field.label }}<span
                                            style="color: red;">{{field.mandatory==true?'*':''}}</span></label>
                                    <div class="error-alert"
                                        *ngIf="form.get(field.name)?.hasError('required') && form.get(field.name)?.touched">
                                        {{ field.label }} is required.
                                    </div>
                                </div>

                            </div>

                            <!-- CHAR -->
                            <div *ngSwitchCase="'CHAR'" class="form-group">

                                <div class="app-input-field">
                                    <input type="text" [id]="field.name" placeholder="" [formControlName]="field.name"
                                        [ngClass]="{'is-invalid' : isInvalid('form', field.name)}">
                                    <label [for]="field.name">{{ field.label }}<span
                                            style="color: red;">{{field.mandatory==true?'*':''}}</span></label>

                                    <div class="error-alert"
                                        *ngIf="form.get(field.name)?.hasError('required') && form.get(field.name)?.touched">
                                        {{ field.label }} is required.
                                    </div>
                                </div>
                            </div>

                            <!-- DROP_DOWN -->
                            <div *ngSwitchCase="'DROP_DOWN'" style=" padding-left: 10;">

                                <div class="app-dropdown">
                                    <p-dropdown
                                        [styleClass]=" isInvalid('form',field.name) ? 'is-invalid' : 'app-dropdown-field' "
                                        [options]="field.userDefinedFieldDomainDataList" [formControlName]="field.name"
                                        optionLabel="label" optionValue="value" appendTo="body"
                                        [placeholder]="'Select '+ field.label"
                                        (onChange)="onSelectChange($event, field.name)"></p-dropdown>
                                    <label for="dataType">{{ field.label }}<span
                                            style="color: red;">{{field.mandatory==true?'*':''}}</span></label>
                                    <div class="error-alert"
                                        *ngIf="form.get(field.name)?.hasError('required') && form.get(field.name)?.touched">
                                        {{ field.label }} is required.
                                    </div>


                                </div>
                            </div>

                        </ng-container>
                    </div>
                </ng-container>
            </div>
            <div style="text-align: center; margin-bottom: 20px;">
                <button type="submit" class="app-button" (click)="showReport()">Show Report</button>
            </div>

        </form>
        <div class="app-card" style="margin-bottom: 10px;">
            <textarea name="" id="" style="width: 100%; height: 200px;">{{formValue}}</textarea>

        </div>
    </div>


</div>
