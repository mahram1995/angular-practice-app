<div class="app-page">
    <div>
        <div style="padding: 0px 10px 0px 10px;">
            <div style="float:left  ">
                <p class="app-page-header">Financial Institutes</p>
            </div>
            <div class="app-button-group">
                <button (click)="showLookup(op, $event)"><i class="pi pi-search" style="font-size:10px"></i>
                    Search</button>
                <button (click)="create()"><i class="pi pi-plus" style="font-size:10px"></i> Create</button>
                <button (click)="refresh()"><i class="pi pi pi-refresh" style="font-size:12px"></i> Refresh</button>
                <button (click)="back()"><i class="pi pi-angle-left" style="font-size:12px"></i> Back</button>
            </div>
        </div>
    </div>
</div>
<hr style="margin-top: 5px;margin-bottom: 2px;">
<div class="app-list">
    <div style="padding: 0px 5px 5px 5px">
        <p-table class="table-striped table-bordered table-hover table-responsive" #dataTable [value]="bankList"
            [paginator]="true" [rows]="rowPerPage" [totalRecords]="totalRecords" styleClass="p-datatable-sm"
            (onRowSelect)="onRowSelect(selectedBank)" [selectionMode]="'single'" [(selection)]="selectedBank"
            [rowsPerPageOptions]="[15,20,25,30,50,100]" [lazy]="true" (onLazyLoad)="onLazyLoad($event)">
            <ng-template pTemplate="header">
                <tr style="font-size: 14px;">
                    <th style="width: 70px;">Bank Id</th>
                    <th style="width: 70px;">Code</th>
                    <th style="min-width: 250px;">Bank Name</th>
                    <th style="width: 110px;">Sort Name</th>
                    <th style="width: 150px;">Swift Code</th>
                    <th style="width: 200px;">Owner Type</th>
                    <th style="width: 250px;">Website</th>
                    <th style="min-width: 300px;">Address</th>
                    <th style="width: 150px;">Institute Type</th>
                    <th style="width: 65px;">Action</th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-data>
                <tr style="font-size: 14px;" [pSelectableRow]="data">
                    <td style="text-align: center;">{{data.id}}</td>
                    <td style="text-align: center;">{{data.bankCode}}</td>
                    <td>{{data.bankName}}</td>
                    <td style="text-align: center;">{{data.bankSortName}}</td>
                    <td style="text-align: center;">{{data.swiftCode}}</td>
                    <td style="text-align: center;">{{data.ownerType}}</td>
                    <td style="text-align: center;">{{data.website}}</td>
                    <td style="text-align: center;">{{data.addressLine1}}</td>
                    <td style="text-align: center;">{{data.financialInstitutionType}}</td>
                    <td style="text-align: center;">
                        <p-button [styleClass]="'tree-dot-button'" (click)="opShowOption.show($event)"
                            icon="pi pi-ellipsis-v"></p-button>
                        <p-overlayPanel styleClass="app-overly-buttons" #opShowOption [style]="{ width: '180px'}">
                            <button class="app-action-button" (click)="onDetails(data)">
                                <i class="pi pi-qrcode" style="font-size:13px ; padding-right:5px">
                                </i> Details</button>
                            <button class="app-action-button" (click)="onEdit(data)">
                                <i class="pi pi-file-edit" style="font-size:13px ; padding-right:5px">
                                </i> Modification</button>
                        </p-overlayPanel>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>


    <p-overlayPanel #op [style]="{ width: '250px' }" showCloseIcon="true" [appendTo]="'body'">
        <form [formGroup]="searchForm">
            <div style="margin: 20px 10px 10px 10px;">
                <div class="row app-row">
                    <div class="col-sm-6  col-md-12 ">
                        <div class="app-input-field">
                            <input type="text" id="bankName" placeholder=" " formControlName="bankName">
                            <label for="bankName">Bank Name</label>
                        </div>
                    </div>
                </div>
                <div style="text-align: center;">
                    <button class="app-button" (click)="search();op.hide()">Search</button>
                </div>
            </div>
        </form>
    </p-overlayPanel>
</div>
