<div>
    <div style="padding: 0px 10px 0px 10px;">
        <div style="float:left ; margin: 0px; padding: 0px; ">
            <p class="app-page-header">{{header}}</p>
        </div>
        <div class="app-button-group">
            <button (click)="onAccept()"><i class="pi pi-verified" style="font-size:13px"></i> Accept</button>
            <button (click)="onReject()"><i class="pi pi-times-circle" style="font-size:13px"></i> Rejection</button>
            <button (click)="onCorrection()"><i class="pi pi-file-edit" style="font-size:13px"></i> Correction</button>
            <button (click)="onDelegation()"><i class="pi pi-file-edit" style="font-size:13px"></i> Delegate</button>
            <button (click)="back()"><i class="pi pi-angle-left" style="font-size:12px"></i> Back</button>
        </div>
    </div>
    <div class="clear-fix"></div>
    <hr style="margin-top: 5px;">
</div>


<p-dialog header="Delegate Task" [(visible)]="isDeligate" [modal]="true" closable="true" [style]="{'width': '370px'}"
    [draggable]="true" [resizable]="false">
    <p class="m-0">
    <form [formGroup]="userDeligateForm" (ngSubmit)="onSubmit()">
        <div class="row">
            <div class=" col-md-12">
                <div class="app-dropdwon">
                    <p-dropdown styleClass="app-dropdown-field" appendTo="body" [filter]="true"
                        formControlName="deligateUser" [style]="{width:'100%',}" [resetFilterOnHide]='true'
                        placeholder="Select a user" [options]="userList" filterBy="label" optionValue="value"
                        optionLabel="label">
                    </p-dropdown>
                    <div
                        *ngIf="userDeligateForm.controls['deligateUser'].errors && userDeligateForm.controls ['deligateUser'].touched">
                        <div class="error-message" style="color: red; font-size: 12px;"
                            [hidden]="!userDeligateForm.controls['deligateUser'].errors.required">
                            Delegate user required.</div>
                    </div>
                </div>
            </div>
        </div>
        <br>
        <div style="text-align: center;">
            <input type="submit" class="btn" (click)="submitDeligation()"
                style="background-color: #086960; width:80px; height: 35px; color: white;  font-size: 13px;"
                value="Delegate" name="">
        </div>
    </form>

</p-dialog>
